services:
  - type: web
    name: shiksha-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: shiksha_ai
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
