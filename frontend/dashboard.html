<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard | ShikshaAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    shell('dashboard.html', 'Dashboard', `
      <section class="dash-hero">
        <div>
          <h2>👋 Welcome back, <span id="heroName">Student</span>!</h2>
          <p>Ready to continue learning today? You are on a <b>17-day streak</b>!</p>
          <div style="margin-top:18px;">
            <a class="btn btn-accent" href="summary.html">Continue Last Lesson →</a>
          </div>
        </div>
      </section>

      <section class="card" style="margin-bottom:28px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div style="font-weight:600; font-size:15px;">Overall Course Completion</div>
          <div class="badge badge-gold" style="font-size:13px;">72% Completed</div>
        </div>
        <div class="progress">
          <i style="width:72%;"></i>
        </div>
      </section>

      <section class="stat-grid" id="stats">
        <!-- Rendered dynamically -->
      </section>

      <section class="two-col">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
            <h3 style="margin:0; font-size:18px;">Recent Activity</h3>
            <span class="muted" style="font-size:12px;">Updated live</span>
          </div>
          <div id="activity"></div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 18px; font-size:18px;">Quick Actions</h3>
          <div class="quick-grid">
            <a class="quick-card" href="upload.html">
              <span style="font-size:20px;">⇧</span>
              <span>Upload PDF</span>
            </a>
            <a class="quick-card" href="summary.html">
              <span style="font-size:20px;">▤</span>
              <span>My Lessons</span>
            </a>
            <a class="quick-card" href="quiz.html">
              <span style="font-size:20px;">?</span>
              <span>Take Quiz</span>
            </a>
            <a class="quick-card" href="flashcards.html">
              <span style="font-size:20px;">▣</span>
              <span>Flashcards</span>
            </a>
          </div>
        </div>
      </section>
    `);

    (async () => {
      try {
        const u = JSON.parse(localStorage.getItem('shiksha_user') || '{}');
        document.querySelector('#heroName').textContent = (u.name || 'Student').split(' ')[0];

        const d = await api.get('/dashboard');
        
        const statConfig = [
          { title: 'Uploaded PDFs', val: d.stats.pdfs, icon: '📚', theme: 'c-green', trend: '▲ +2 this week', pct: 80 },
          { title: 'Audio Lessons', val: d.stats.audio_lessons, icon: '🎧', theme: 'c-purple', trend: '✦ 100% generated', pct: 65 },
          { title: 'Quiz Score', val: `${d.stats.quiz_scores}%`, icon: '🧠', theme: 'c-blue', trend: '★ Mastery: High', pct: d.stats.quiz_scores || 75 },
          { title: 'Study Streak', val: '17 Days', icon: '🔥', theme: 'c-orange', trend: '🔥 Active Streak', pct: 90 }
        ];

        document.querySelector('#stats').innerHTML = statConfig.map(s => `
          <article class="stat-card ${s.theme}">
            <div class="stat-icon">${s.icon}</div>
            <span class="muted" style="font-size:13px; font-weight:500;">${s.title}</span>
            <b>${s.val}</b>
            <div class="progress" style="height:6px; margin:8px 0;">
              <i style="width:${s.pct}%"></i>
            </div>
            <div class="trend">${s.trend}</div>
          </article>
        `).join('');

        const actContainer = document.querySelector('#activity');
        actContainer.innerHTML = d.history.length ? d.history.map(x => `
          <div class="activity">
            <div class="dot">${x.icon || '✦'}</div>
            <div style="flex:1;">
              <b style="font-size:14px; color:var(--text);">${x.activity}</b>
              <div class="muted" style="font-size:12px;">${formatDate(x.date)}</div>
            </div>
          </div>
        `).join('') : '<div class="empty">Your learning activity will appear here.</div>';

      } catch (e) {
        toast(e.message, 'error');
      }
    })();
  </script>
</body>
</html>
