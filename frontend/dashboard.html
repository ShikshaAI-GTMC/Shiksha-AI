<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>requireAuth();shell('dashboard.html','Welcome back!','<section class="stat-grid" id="stats"></section><section class="two-col"><div class="card"><h3>Recent activity</h3><div id="activity"></div></div><div class="card"><h3>Quick actions</h3><div class="quick-grid"><a href="upload.html">⇧ Upload PDF</a><a href="summary.html">▤ My Lessons</a><a href="quiz.html">? Take a Quiz</a><a href="flashcards.html">▣ Flashcards</a></div></div></section>');(async()=>{try{let d=await api.get('/dashboard');stats.innerHTML=[['Uploaded PDFs',d.stats.pdfs],['Audio Lessons',d.stats.audio_lessons],['Quiz Scores',d.stats.quiz_scores],['Study Hours',d.stats.study_hours]].map(x=>`<article class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b><small class="muted">Your learning progress</small></article>`).join('');activity.innerHTML=d.history.length?d.history.map(x=>`<div class="activity"><div class="dot">${x.icon||'✦'}</div><div><b>${x.activity}</b><div class="muted">${formatDate(x.date)}</div></div></div>`).join(''):'<div class="empty">Your learning activity will appear here.</div>'}catch(e){toast(e.message,'error')}})()</script></body></html>
