<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-wrap"><form class="auth-card" id="signupForm"><a class="brand" href="index.html">Shiksha<span>AI</span></a><h1>Start learning better</h1><p>Create your free ShikshaAI account.</p><div class="field"><label for="fullName">Full name</label><input id="fullName" name="name" required minlength="2" placeholder="Your name"></div><div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters"></div><div class="field"><label for="confirm">Confirm password</label><input type="password" id="confirm" name="confirm" required placeholder="Repeat password"></div><button type="submit" class="btn">Create account →</button><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></form></main><script src="js/api.js"></script><script src="js/app.js"></script><script>const signupForm=document.querySelector('#signupForm');signupForm.onsubmit=async event=>{event.preventDefault();const form=new FormData(signupForm);if(form.get('password')!==form.get('confirm'))return toast('Passwords do not match','error');try{await api.post('/signup',{name:form.get('name'),email:form.get('email'),password:form.get('password')});toast('Account created. Please login.');setTimeout(()=>location.href='login.html',700)}catch(error){toast(error.message,'error')}};</script></body></html>
