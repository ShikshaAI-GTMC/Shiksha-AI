<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>requireAuth();let id=new URLSearchParams(location.search).get('id'),quiz;shell('quiz.html','Knowledge quiz','<div id="main"></div>');async function load(){if(!id){let x=await api.get('/pdfs');main.innerHTML=x.length?'<div class="lesson-list">'+x.map(p=>`<article class="card"><b>${p.title}</b><a class="btn" href="quiz.html?id=${p.id}">Take quiz</a></article>`).join('')+'</div>':'<div class="empty">Upload a PDF to take a quiz.</div>';return}try{quiz=await api.get('/pdf/'+id+'/quiz');if(!quiz.questions?.length){await api.post('/generate-quiz',{pdf_id:id});quiz=await api.get('/pdf/'+id+'/quiz')}main.innerHTML=`<form id="qform">${quiz.questions.map((q,i)=>`<section class="card quiz-question"><b>${i+1}. ${q.question}</b>${q.options.map((o,j)=>`<label class="option"><input required type="radio" name="q${i}" value="${j}">${o}</label>`).join('')}</section>`).join('')}<button class="btn">Submit quiz</button></form>`;qform.onsubmit=submit}catch(e){toast(e.message,'error')}}async function submit(e){e.preventDefault();let answers=quiz.questions.map((q,i)=>+new FormData(qform).get('q'+i));try{let r=await api.post('/pdf/'+id+'/submit-quiz',{answers});main.innerHTML=`<article class="card" style="text-align:center"><div class="eyebrow">Quiz complete</div><h2>${r.percentage}%</h2><p><b>${r.correct}</b> correct · <b>${r.wrong}</b> wrong</p><p class="muted">${r.message}</p><a class="btn" href="quiz.html?id=${id}">Try again</a></article>`}catch(x){toast(x.message,'error')}}load()</script></body></html>
