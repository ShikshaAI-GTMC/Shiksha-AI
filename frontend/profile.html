<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>requireAuth();shell('profile.html','My profile','<div class="two-col"><article class="card"><h3 id="n"></h3><p id="e" class="muted"></p><button class="btn" style="margin-top:20px" onclick="logout()">Logout</button></article><article class="card"><h3>Learning statistics</h3><div id="s"></div></article></div>');(async()=>{try{let d=await api.get('/dashboard'),u=JSON.parse(localStorage.shiksha_user);n.textContent=u.name;e.textContent=u.email;s.innerHTML=`<p>Uploaded PDFs <b style="float:right">${d.stats.pdfs}</b></p><p>Quiz scores <b style="float:right">${d.stats.quiz_scores}</b></p><p>Study hours <b style="float:right">${d.stats.study_hours}</b></p>`}catch(x){toast(x.message,'error')}})()</script></body></html>
