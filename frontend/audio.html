<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Lessons | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>
requireAuth();shell('audio.html','Audio lessons','<div id="main" class="lesson-list"></div>');
function card(x,i){return `<article class="card"><div><b>${x.title}</b><p>Created ${formatDate(x.created_at)} · Ready to listen</p><p>${x.script.slice(0,150)}…</p></div><div class="tools"><button class="btn" onclick="playLesson(window.audioLessons[${i}].script,'${x.voice}')">Play</button><button class="btn btn-outline" onclick="pauseLesson()">Pause</button><a class="btn btn-outline" href="summary.html?id=${x.pdf_id}">Open</a></div></article>`}
async function load(){try{let x=await api.get('/audio-lessons');window.audioLessons=x;main.innerHTML=x.length?x.map(card).join(''):'<div class="empty">No audio lessons yet. Open a lesson and choose “Generate audio lesson.”</div>'}catch(e){toast(e.message,'error')}}load()
</script></body></html>
