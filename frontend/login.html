<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-wrap"><form class="auth-card" id="loginForm"><a class="brand" href="index.html">Shiksha<span>AI</span></a><h1>Welcome back</h1><p>Continue your learning journey.</p><div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required minlength="8" placeholder="Your password"></div><button type="submit" class="btn">Login →</button><p class="auth-switch">New here? <a href="signup.html">Create your account</a></p></form></main><script src="js/api.js"></script><script src="js/app.js"></script><script>const loginForm=document.querySelector('#loginForm');loginForm.onsubmit=async event=>{event.preventDefault();const form=new FormData(loginForm);try{const data=await api.post('/login',{email:form.get('email'),password:form.get('password')});localStorage.setItem('shiksha_token',data.access_token);localStorage.setItem('shiksha_user',JSON.stringify(data.user));location.href='dashboard.html'}catch(error){toast(error.message,'error')}};</script></body></html>
