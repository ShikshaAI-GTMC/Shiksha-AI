<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcards | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>requireAuth();let id=new URLSearchParams(location.search).get('id'),cards=[],n=0;shell('flashcards.html','Flashcards','<div id="main"></div>');async function load(){if(!id){let x=await api.get('/pdfs');main.innerHTML=x.length?'<div class="lesson-list">'+x.map(p=>`<article class="card"><b>${p.title}</b><a class="btn" href="flashcards.html?id=${p.id}">Study cards</a></article>`).join('')+'</div>':'<div class="empty">Upload a PDF to generate flashcards.</div>';return}try{cards=await api.get('/pdf/'+id+'/flashcards');if(!cards.length){await api.post('/generate-flashcards',{pdf_id:id});cards=await api.get('/pdf/'+id+'/flashcards')}render()}catch(e){toast(e.message,'error')}}function render(){let c=cards[n];main.innerHTML=`<p class="muted" style="text-align:center">Card ${n+1} of ${cards.length} · Click to flip</p><div class="flashcard" id="fc" onclick="this.classList.toggle('flip')"><div class="flashcard-inner"><div class="flash-face">${c.question}</div><div class="flash-face flash-back">${c.answer}</div></div></div><div style="text-align:center"><button class="btn btn-outline" onclick="move(-1)">← Previous</button> <button class="btn" onclick="move(1)">Next →</button></div>`}function move(x){n=(n+x+cards.length)%cards.length;render()}load()</script></body></html>
