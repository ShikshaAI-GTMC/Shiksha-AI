<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lessons | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>
requireAuth();let id=new URLSearchParams(location.search).get('id');shell('summary.html',id?'Lesson summary':'My lessons','<div id="main" class="lesson-list"></div>');
function audioCard(a){window.lessonScript=a.script;return `<article class="audio-player"><div class="audio-head"><div><b>Audio lesson</b><p class="muted" data-speech-status>Ready to play</p></div><span class="audio-icon">♫</span></div><div class="tools"><button class="btn" onclick="playLesson(window.lessonScript,'${a.voice}')">Play</button><button class="btn btn-outline" onclick="pauseLesson()">Pause</button><button class="btn btn-outline" onclick="resumeLesson()">Resume</button><button class="btn btn-outline" onclick="stopLesson()">Stop</button></div></article>`}
async function load(){try{if(!id){let x=await api.get('/pdfs');main.innerHTML=x.length?x.map(p=>`<article class="card"><div><b>${p.title}</b><p>Uploaded ${formatDate(p.upload_date)}</p></div><a class="btn" href="summary.html?id=${p.id}">Open lesson</a></article>`).join(''):'<div class="empty">No lessons yet. <a href="upload.html" style="color:var(--primary)">Upload your first PDF.</a></div>';return}let p=await api.get('/pdf/'+id);document.querySelector('h1').textContent=p.title;main.innerHTML=`<div class="tools"><button class="btn" onclick="copySummary()">Copy summary</button><button class="btn btn-outline" onclick="downloadSummary()">Download notes</button><a class="btn btn-outline" href="flashcards.html?id=${id}">Flashcards</a><a class="btn btn-outline" href="quiz.html?id=${id}">Quiz</a></div><article class="card"><h3>Short summary</h3><p class="summary-box">${p.summary.short_summary}</p></article><article class="card" style="margin-top:15px"><h3>Detailed summary</h3><p class="summary-box">${p.summary.detailed_summary}</p></article><article class="card" style="margin-top:15px"><h3>Important points</h3><p class="summary-box">${p.summary.bullet_notes.map(x=>'• '+x).join('\n')}</p><p><b>Keywords:</b> ${p.summary.keywords.join(', ')}</p></article><div style="margin-top:15px">${p.audio_lesson?audioCard(p.audio_lesson):'<button class="btn btn-accent" onclick="audio()">Generate audio lesson</button>'}</div>`;window.current=p}catch(e){toast(e.message,'error')}}
async function audio(){try{await api.post('/generate-audio',{pdf_id:id,voice:'female'});toast('Audio lesson is ready');load()}catch(e){toast(e.message,'error')}}function copySummary(){navigator.clipboard.writeText(current.summary.detailed_summary);toast('Summary copied')}function downloadSummary(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([current.summary.detailed_summary],{type:'text/plain'}));a.download='shiksha-summary.txt';a.click()}load()
</script></body></html>
