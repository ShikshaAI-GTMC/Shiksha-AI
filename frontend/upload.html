<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload | ShikshaAI</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script src="js/app.js"></script><script>requireAuth();shell('upload.html','Upload a PDF','<div class="card"><div class="upload-zone" id="zone"><input id="file" type="file" accept="application/pdf"><div style="font-size:40px">⇧</div><strong>Drop your PDF here, or click to browse</strong><span class="muted">PDF only · Maximum file size 50 MB</span></div><div class="upload-progress" id="up"><p id="uploadText">Preparing upload…</p><div class="progress"><i id="bar" style="width:20%"></i></div></div></div>');zone.onclick=()=>file.click();['dragenter','dragover'].forEach(x=>zone.addEventListener(x,e=>{e.preventDefault();zone.classList.add('drag')}));['dragleave','drop'].forEach(x=>zone.addEventListener(x,e=>{e.preventDefault();zone.classList.remove('drag')}));zone.ondrop=e=>upload(e.dataTransfer.files[0]);file.onchange=()=>upload(file.files[0]);async function upload(f){if(!f)return;if(f.type!=='application/pdf')return toast('Please choose a PDF file','error');if(f.size>50*1024*1024)return toast('PDF must be smaller than 50 MB','error');up.style.display='block';bar.style.width='55%';try{const fd=new FormData;fd.append('file',f);const d=await api.post('/upload',fd,true);bar.style.width='100%';uploadText.textContent='PDF processed successfully!';toast('Your lesson is ready');setTimeout(()=>location=`summary.html?id=${d.id}`,700)}catch(e){up.style.display='none';toast(e.message,'error')}}</script></body></html>
