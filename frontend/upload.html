<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Upload PDF | ShikshaAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    shell('upload.html', 'Upload Study Material', `
      <div class="upload-wrapper">
        <div class="card">
          <div class="upload-zone" id="zone">
            <input id="file" type="file" accept="application/pdf">
            <div class="upload-illustration">☁️ 📄</div>
            <strong style="font-size:20px; color:var(--text); display:block; margin-bottom:6px;">
              Drag & Drop your PDF here
            </strong>
            <p class="muted" style="font-size:14px; margin:0 0 20px;">
              Upload textbooks, lecture notes, or syllabus (up to 50 MB)
            </p>
            <button class="btn" type="button">Browse Files</button>
          </div>

          <div class="upload-progress" id="up" style="display:none; margin-top:24px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span id="uploadText" style="font-size:14px; font-weight:600;">Processing PDF content…</span>
              <span id="pctText" style="font-size:14px; color:var(--primary); font-weight:700;">55%</span>
            </div>
            <div class="progress" style="height:10px;">
              <i id="bar" style="width:55%"></i>
            </div>
          </div>
        </div>
      </div>
    `);

    const zone = document.querySelector('#zone');
    const file = document.querySelector('#file');
    const up = document.querySelector('#up');
    const bar = document.querySelector('#bar');
    const uploadText = document.querySelector('#uploadText');
    const pctText = document.querySelector('#pctText');

    zone.onclick = () => file.click();

    ['dragenter', 'dragover'].forEach(x => zone.addEventListener(x, e => {
      e.preventDefault();
      zone.classList.add('drag');
    }));

    ['dragleave', 'drop'].forEach(x => zone.addEventListener(x, e => {
      e.preventDefault();
      zone.classList.remove('drag');
    }));

    zone.ondrop = e => upload(e.dataTransfer.files[0]);
    file.onchange = () => upload(file.files[0]);

    async function upload(f) {
      if (!f) return;
      if (f.type !== 'application/pdf') return toast('Please choose a PDF file', 'error');
      if (f.size > 50 * 1024 * 1024) return toast('PDF must be smaller than 50 MB', 'error');

      up.style.display = 'block';
      bar.style.width = '55%';
      pctText.textContent = '55%';

      try {
        const fd = new FormData();
        fd.append('file', f);
        const d = await api.post('/upload', fd, true);

        bar.style.width = '100%';
        pctText.textContent = '100%';
        uploadText.textContent = 'PDF processed successfully!';
        toast('Your lesson is ready!');
        setTimeout(() => location = `summary.html?id=${d.id}`, 700);
      } catch (e) {
        up.style.display = 'none';
        toast(e.message, 'error');
      }
    }
  </script>
</body>
</html>
